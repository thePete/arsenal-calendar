name: Probe TourneyMachine
on:
  push:
    branches: [probe-wrexham]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          mkdir -p probe
          T=h202609281815321263a25d52d99104c
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" "https://tourneymachine.com/Public/Results/TournamentEmbed.aspx?IDTournament=$T" -o probe/embed.html || true
          curl -sSL -A "$UA" "https://tourneymachine.com/Public/Results/Tournament.aspx?IDTournament=$T" -o probe/tournament.html || true
          curl -sSL -A "$UA" "https://midstatesportsleagues.com/soccer/" -o probe/soccer.html || true
          # follow any division / team links found in the embed page
          grep -oE '(Division|Team)[A-Za-z]*\.aspx\?[^"'"'"' <>]+' probe/*.html | sed 's/&amp;/\&/g' | cut -d: -f2- | sort -u | head -20 > probe/links.txt || true
          i=0; while read -r l; do i=$((i+1)); curl -sSL -A "$UA" "https://tourneymachine.com/Public/Results/$l" -o "probe/link$i.html" || true; done < probe/links.txt
          ls -la probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe output" && git push
