name: Update Arsenal calendar

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calendar
        run: python scripts/build_calendar.py

      - name: Commit if changed
        run: |
          # Ignore the DTSTAMP line so we only commit when fixtures actually change
          if git ls-files --error-unmatch docs/arsenal.ics >/dev/null 2>&1 \
             && git diff --quiet -I '^DTSTAMP:' -- docs/arsenal.ics; then
            echo "No fixture changes."
            git checkout -- docs/arsenal.ics
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/arsenal.ics
          git commit -m "Update Arsenal fixtures"
          git push
